name: Ford LKA research option checks

on:
  push:
    branches: [ford-lka-option]
  pull_request:
    branches: [ford-legacy-lka]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ford-lka-option-${{ github.ref }}
  cancel-in-progress: true

jobs:
  option-and-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            cereal
            common
            openpilot
            opendbc_repo
            panda/board
            panda/python
            panda/tests/libpanda
            site_scons
            selfdrive/car
            selfdrive/controls
            dragonpilot/settings
            system/hardware
            tools/ford_legacy_lka
            tools/ford_stock_acc
            tools/ford_bluepilot
            tools/chrysler_alka
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install numpy pycapnp==2.2.4 cffi pycryptodome scons==4.11.1
      - name: Check option, passive tools and Ford/Pacifica regressions
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
        run: |
          python -m unittest -q opendbc.car.ford.tests.test_legacy_lka_option tools.ford_legacy_lka.test_research tools.ford_legacy_lka.test_dbc tools.ford_legacy_lka.test_passive_safety opendbc.car.ford.tests.test_factory_acc opendbc.car.ford.tests.test_bluepilot opendbc.safety.tests.test_ford_factory_acc opendbc.safety.tests.test_ford_bluepilot opendbc.safety.tests.test_ford opendbc.car.chrysler.tests.test_alka opendbc.safety.tests.test_chrysler_alka opendbc.safety.tests.test_chrysler opendbc.safety.tests.test_alka.TestALKAFord opendbc.safety.tests.test_alka.TestALKADisabledBrands
          python -m compileall -q selfdrive/car/card.py dragonpilot/settings/brand-ford-legacy-lka.py tools/ford_legacy_lka/check_option.py
          git diff --exit-code 5ddfdf0 HEAD -- opendbc_repo/opendbc/safety panda/board/obj/panda_h7.bin.signed

  settings-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            cereal
            common
            openpilot
            opendbc_repo/opendbc/car
            system/hardware
            tools/ford_bluepilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python -m pip install comma-deps-capnproto==1.0.1.post103 comma-deps-json11==20170411.0.post103 comma-deps-zeromq==4.3.5.post103
      - name: Build and check every registered settings key
        run: |
          python tools/ford_bluepilot/rebuild_params.py --root "$PWD" --output build/lka_option/params_pyx.so
          git rev-parse HEAD > build/lka_option/source_commit.txt
          sha256sum build/lka_option/params_pyx.so > build/lka_option/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ford-lka-option-settings-aarch64
          if-no-files-found: error
          path: build/lka_option/
