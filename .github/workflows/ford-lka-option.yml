name: Ford legacy LKA tests and device builds

on:
  push:
    branches: [ford-lka-option, ford-fusion-lka-port]
  pull_request:
    branches: [ford-legacy-lka]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ford-lka-option-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  safety-and-h7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            cereal
            common
            openpilot
            opendbc_repo
            panda/board
            panda/python
            panda/tests/libpanda
            site_scons
            selfdrive/car
            selfdrive/controls
            selfdrive/selfdrived
            selfdrive/locationd
            dragonpilot/settings
            system/hardware
            tools/ford_legacy_lka
            tools/ford_stock_acc
            tools/ford_bluepilot
            tools/chrysler_alka
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq -o Acquire::Retries=0 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-dev
          python -m pip install numpy pycapnp==2.2.4 cffi pycryptodome scons==4.11.1
      - name: Check option, passive tools and Ford/Pacifica regressions
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
        run: |
          python -m unittest -q opendbc.car.ford.tests.test_legacy_lka_option opendbc.safety.tests.test_ford_legacy_lka tools.ford_legacy_lka.test_research tools.ford_legacy_lka.test_dbc tools.ford_legacy_lka.test_passive_safety opendbc.car.ford.tests.test_factory_acc opendbc.car.ford.tests.test_bluepilot opendbc.safety.tests.test_ford_factory_acc opendbc.safety.tests.test_ford_bluepilot opendbc.safety.tests.test_ford opendbc.car.chrysler.tests.test_alka opendbc.safety.tests.test_chrysler_alka opendbc.safety.tests.test_chrysler opendbc.safety.tests.test_alka.TestALKAFord opendbc.safety.tests.test_alka.TestALKADisabledBrands
          python -m compileall -q selfdrive/car/card.py dragonpilot/settings/brand-ford-legacy-lka.py tools/ford_legacy_lka/check_option.py
          python -m unittest -q tools.ford_legacy_lka.test_diagnostics tools.ford_legacy_lka.test_host_latch opendbc.car.ford.tests.test_fusion_lka_port opendbc.safety.tests.test_ford_fusion_lka_port
      - name: Verify packaged release when source matches
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          p=Path('tools/ford_legacy_lka/release.json')
          if p.exists():
            manifest=json.loads(p.read_text())
            if manifest.get('package_status') == 'native-build-pending':
              print('Source-only port: H7 package will be verified after the build is pinned.')
            else:
              subprocess.run([sys.executable,'tools/ford_legacy_lka/verify_release.py'],check=True)
          PY
      - name: Build signed H7 application
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/opendbc_repo
        run: |
          scons -C panda --site-dir=../site_scons -j2 board/obj/panda_h7.bin.signed
          git rev-parse HEAD > panda/board/obj/source_commit.txt
          sha256sum panda/board/obj/panda_h7.bin.signed > panda/board/obj/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ford-legacy-lka-h7
          if-no-files-found: error
          path: |
            panda/board/obj/panda_h7.bin.signed
            panda/board/obj/source_commit.txt
            panda/board/obj/SHA256SUMS
            panda/board/obj/version

  settings-aarch64:
    if: github.ref_name != 'ford-fusion-lka-port'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            cereal
            common
            openpilot
            opendbc_repo/opendbc/car
            system/hardware
            tools/ford_bluepilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python -m pip install comma-deps-capnproto==1.0.1.post103 comma-deps-json11==20170411.0.post103 comma-deps-zeromq==4.3.5.post103
      - name: Build and check every registered settings key
        run: |
          python tools/ford_bluepilot/rebuild_params.py --root "$PWD" --output build/lka_option/params_pyx.so
          git rev-parse HEAD > build/lka_option/source_commit.txt
          sha256sum build/lka_option/params_pyx.so > build/lka_option/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ford-lka-option-settings-aarch64
          if-no-files-found: error
          path: build/lka_option/
